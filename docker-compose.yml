services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: taskly
      POSTGRES_PASSWORD: taskly
      POSTGRES_DB: taskly_dev
    ports:
      - "5434:5432"
    volumes:
      - taskly_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskly_pg_data:
